[project]
name = "stepper"
version = "0.1.0"
description = "Pure-python STEP (ISO 10303) reader: Part 21 exchange files, EXPRESS schemas, AP242 semantic checks"
authors = [{ name = "Jon Fox" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
]
license = "MIT"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "stepper", from = "src" }]

[tool.poetry.scripts]
stepper = "stepper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "conformance: slow tests over the full NIST corpus",
]